name: Native host acceptance
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Runner platform (all keeps the full release matrix)
        type: choice
        default: all
        options: [all, ubuntu-latest, macos-latest, windows-latest]
      host:
        description: Exact DSH host (all keeps the full release matrix)
        type: choice
        default: all
        options: [all, '0.2.0-rc.2', '0.2.1-alpha.1', '0.2.1-alpha.2']
permissions:
  contents: read
jobs:
  native-web:
    name: ${{ matrix.os }} / DSH ${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform != '' && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        host: ${{ fromJSON(inputs.host != '' && inputs.host != 'all' && format('["{0}"]', inputs.host) || '["0.2.0-rc.2","0.2.1-alpha.1","0.2.1-alpha.2"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: pnpm/action-setup@v6
        with:
          version: '11.23.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Windows private state diagnostic
        if: runner.os == 'Windows'
        continue-on-error: true
        run: node scripts/windows-state-diagnostic.mjs
      - run: npm test
      - name: Build against exact host SDK and install the package
        run: node scripts/package-host.mjs ${{ matrix.host }}
      - name: Native SDK and packaged Web lifecycle
        shell: bash
        env:
          HOST: ${{ matrix.host }}
        run: |
          export IUI_TEST_SDK_ROOT="$PWD/work/builds/$HOST"
          export IUI_TEST_CLI="$PWD/work/builds/$HOST/node_modules/@deepseek-ai/dsh/lib/bin.js"
          IUI_REVISION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version.split(".iui.")[1]')"
          export IUI_TEST_PACKAGE="$PWD/work/packages/dsh-intelligent-ui-$HOST.iui.$IUI_REVISION.tgz"
          node --test --test-concurrency=1 test/host/*.test.mjs
