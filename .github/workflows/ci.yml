name: Native host acceptance
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-web:
    name: ${{ matrix.os }} / DSH ${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        host: ['0.2.0-rc.2', '0.2.1-alpha.1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: pnpm/action-setup@v6
        with:
          version: '11.23.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - name: Build against exact host SDK and install the package
        run: node scripts/package-host.mjs ${{ matrix.host }}
      - name: Native SDK and packaged Web lifecycle
        shell: bash
        env:
          HOST: ${{ matrix.host }}
        run: |
          export IUI_TEST_SDK_ROOT="$PWD/work/builds/$HOST"
          export IUI_TEST_CLI="$PWD/work/builds/$HOST/node_modules/@deepseek-ai/dsh/lib/bin.js"
          export IUI_TEST_PACKAGE="$PWD/work/packages/dsh-intelligent-ui-$HOST.iui.1.0.0.tgz"
          node --test --test-concurrency=1 test/host/native-service.test.mjs test/host/ui-adapter*.test.mjs test/host/web-product.test.mjs
